[workspace]
resolver = "3"
members = [
    "ipscan",
    "ipscan-lib",
    "nu-plugin-ipscan"
]

[workspace.package]
version = "0.15.1"
license = "AGPL-3.0-or-later"
authors = ["Saluki"]
edition = "2024"
rust-version = "1.90"
homepage = "https://github.com/averyfreeman/nu_plugin_ipscan"
repository = "https://github.com/averyfreeman/nu_plugin_ipscan"

[workspace.dependencies]

ipscan-lib = { path = "ipscan-lib" }
nu-plugin = "0.115.1"
nu-protocol = "0.115.1"

# CLI & utilities
clap = { version = "4.5", default-features = false, features = ["std", "suggestions", "color", "help"] }
ansi_term = "0.12"
rand = "0.9"
ctrlc = "3.5"
caps = "0.5.6"

# Network
pnet = "0.35"
pnet_datalink = "0.35"
ipnetwork = "0.20"
dns-lookup = "3.0"

# Parsing & exports
csv = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
